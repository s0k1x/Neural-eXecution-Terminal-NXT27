<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NXT27 Terminal</title>
<meta name="description" content="Neural eXecution Terminal NXT27 — terminal web funcional con estética hacker.">
<style>
:root{
  --bg:#050308;--panel:#0a0710;--line:#241834;--line-soft:#160f22;
  --accent:#a855f7;--accent-bright:#c084fc;--accent-dim:#6d28d9;
  --txt:#d9d2ea;--txt-dim:#8b82a0;--txt-faint:#564d6e;
  --ok:#4ade80;--warn:#e3b341;--err:#f87171;
  --glow:0 0 8px rgba(168,85,247,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:14px;line-height:1.55;height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* subtle backdrop */
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 50% -8%,rgba(109,40,217,.16),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.25) 3px 4px);
  opacity:.7}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh}

.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:#08050d;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--txt-dim)}
.bar .hex{width:11px;height:11px;transform:rotate(45deg);background:var(--accent-bright);box-shadow:var(--glow)}
.bar b{color:var(--txt);font-weight:700;letter-spacing:1px}
.bar .spacer{flex:1}
.bar .dot{width:9px;height:9px;border:1px solid var(--line);border-radius:50%}
.bar .clk{color:var(--txt-faint)}

#term{flex:1;overflow-y:auto;padding:14px 16px 90px;scroll-behavior:smooth;
  background:linear-gradient(180deg,rgba(168,85,247,.015),transparent 120px)}
#term::-webkit-scrollbar{width:8px}
#term::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.ln{white-space:pre-wrap;word-break:break-word}
.muted{color:var(--txt-dim)}
.faint{color:var(--txt-faint)}
.accent{color:var(--accent-bright)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.ln b{color:var(--accent-bright);font-weight:700}
.logo{color:var(--accent-bright);text-shadow:var(--glow);line-height:1.15;font-size:13px}

/* input row (also used in-flow for echoed history) */
.row{display:flex;align-items:flex-start;gap:0;white-space:pre-wrap}
.ps1{color:var(--accent-bright);white-space:pre}
.ps1 .host{color:var(--accent)}
.ps1 .path{color:var(--txt)}

#inputRow{position:sticky;bottom:0;display:flex;align-items:center;gap:0;
  padding:10px 16px;background:linear-gradient(180deg,transparent,var(--bg) 30%);
  border-top:1px solid var(--line-soft)}
#cmd{flex:1;background:transparent;border:0;outline:0;color:var(--txt);
  font:inherit;caret-color:var(--accent-bright);padding:0;margin:0}
#cmd::placeholder{color:var(--txt-faint)}

a{color:var(--accent-bright)}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="hex"></span><b>NXT27</b>
    <span class="muted">neural · execution · terminal</span>
    <span class="spacer"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="clk" id="clk">--:--:--</span>
  </div>

  <div id="term" aria-live="polite"></div>

  <form id="inputRow" autocomplete="off">
    <span class="ps1" id="ps1"></span>
    <input id="cmd" name="cmd" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-label="comando" />
  </form>
</div>

<script>
"use strict";
const term = document.getElementById("term");
const input = document.getElementById("cmd");
const ps1El = document.getElementById("ps1");
const clkEl = document.getElementById("clk");

const USER = "neural", HOST = "NXT-27";
const started = Date.now();

/* ---------- virtual filesystem ---------- */
const FS = {
  "readme.txt": "NXT27 — Neural eXecution Terminal\nTerminal web con estetica. Escribe 'help' para ver comandos.",
  "about.txt": "Demo con toque visual y comandos reales (offline, en tu navegador).",
  proyectos: {
    "nxt27.md": "# NXT27\nterminal + .exe + web. Hecho para divertirse.",
    "ideas.txt": "- temas de color\n- mas comandos\n- mini-juegos"
  },
  logs: { "boot.log": "[ok] kernel\n[ok] display\n[ok] shell" }
};
let cwd = []; // path segments from root

function nodeAt(segs){
  let n = FS;
  for(const s of segs){ if(n && typeof n==="object" && s in n) n=n[s]; else return undefined; }
  return n;
}
function cwdLabel(){ return "~" + (cwd.length? "/"+cwd.join("/") : ""); }
function resolve(path){
  // returns new segment array or null
  let segs = (path.startsWith("/")||path.startsWith("~")) ? [] : cwd.slice();
  for(const part of path.replace(/^~\/?/,"").split("/")){
    if(part===""||part===".") continue;
    if(part===".."){ segs.pop(); continue; }
    segs.push(part);
  }
  return segs;
}

/* ---------- output helpers ---------- */
function out(text="", cls=""){
  const d=document.createElement("div");
  d.className="ln"+(cls?" "+cls:"");
  d.textContent=text;
  term.appendChild(d);
}
function outHTML(html, cls=""){
  const d=document.createElement("div");
  d.className="ln"+(cls?" "+cls:"");
  d.innerHTML=html;
  term.appendChild(d);
}
function echoCommand(line){
  const d=document.createElement("div");
  d.className="row";
  d.innerHTML=`<span class="ps1">${ps1HTML()}</span>`;
  const c=document.createElement("span");
  c.textContent=line;
  d.appendChild(c);
  term.appendChild(d);
}
function scroll(){ term.scrollTop=term.scrollHeight; }

function ps1HTML(){
  return `<span class="host">${USER}@${HOST}</span>:<span class="path">${cwdLabel()}</span>$ `;
}
function renderPrompt(){ ps1El.innerHTML=ps1HTML(); }

/* ---------- commands ---------- */
const LOGO = String.raw`
 ███╗   ██╗██╗  ██╗████████╗██████╗ ███████╗
 ████╗  ██║╚██╗██╔╝╚══██╔══╝╚════██╗╚════██║
 ██╔██╗ ██║ ╚███╔╝    ██║    █████╔╝    ██╔╝
 ██║╚██╗██║ ██╔██╗    ██║   ██╔═══╝    ██╔╝
 ██║ ╚████║██╔╝ ██╗   ██║   ███████╗   ██║
 ╚═╝  ╚═══╝╚═╝  ╚═╝   ╚═╝   ╚══════╝   ╚═╝`;

const THEMES = {
  violet:["#a855f7","#c084fc","#6d28d9"],
  cyan:  ["#22d3ee","#67e8f9","#0891b2"],
  green: ["#22c55e","#4ade80","#15803d"],
  amber: ["#f59e0b","#fbbf24","#b45309"],
  red:   ["#ef4444","#f87171","#b91c1c"],
  pink:  ["#ec4899","#f9a8d4","#be185d"],
};

const COMMANDS = {
  help(){
    out("Comandos disponibles:","accent");
    const list=[
      ["help","esta ayuda"],["clear","limpia la pantalla"],
      ["echo <txt>","imprime texto"],["whoami","usuario actual"],
      ["date","fecha y hora"],["uptime","tiempo encendido"],
      ["ls [ruta]","lista archivos"],["cd <ruta>","cambia de carpeta"],
      ["pwd","ruta actual"],["cat <archivo>","muestra un archivo"],
      ["tree","arbol de archivos"],["mkdir <n>","crea carpeta"],
      ["touch <n>","crea archivo"],["rm <n>","borra"],
      ["calc <expr>","calculadora (2+2*3)"],["neofetch","info del sistema"],
      ["banner","logo NXT27"],["theme <color>","cambia color"],
      ["history","historial"],["about","sobre esto"],["exit","reinicia"],
    ];
    const w=Math.max(...list.map(c=>c[0].length));
    for(const [c,d] of list) out("  "+c.padEnd(w+2)+" "+d,"muted");
    out("");
    out("Atajos: ↑/↓ historial · Tab autocompletar · Ctrl+L limpiar","faint");
  },
  clear(){ term.innerHTML=""; },
  echo(args){ out(args.join(" ")); },
  whoami(){ out(USER); },
  date(){ out(new Date().toString()); },
  uptime(){
    const s=Math.floor((Date.now()-started)/1000);
    const m=Math.floor(s/60), h=Math.floor(m/60);
    out(`activo ${h}h ${m%60}m ${s%60}s`);
  },
  pwd(){ out("/"+cwd.join("/")); },
  ls(args){
    const target = args[0] ? resolve(args[0]) : cwd;
    const n = nodeAt(target);
    if(n===undefined) return out("ls: no existe: "+args[0],"err");
    if(typeof n==="string") return out(args[0]);
    const keys=Object.keys(n);
    if(!keys.length) return out("(vacio)","faint");
    for(const k of keys){
      const dir = typeof n[k]==="object";
      outHTML(`  <span class="${dir?'accent':''}">${k}${dir?'/':''}</span>`);
    }
  },
  cd(args){
    if(!args[0]||args[0]==="~"){ cwd=[]; return; }
    const segs=resolve(args[0]);
    const n=nodeAt(segs);
    if(n===undefined) return out("cd: no existe: "+args[0],"err");
    if(typeof n!=="object") return out("cd: no es una carpeta: "+args[0],"err");
    cwd=segs;
  },
  cat(args){
    if(!args[0]) return out("uso: cat <archivo>","warn");
    const n=nodeAt(resolve(args[0]));
    if(n===undefined) return out("cat: no existe: "+args[0],"err");
    if(typeof n==="object") return out("cat: es una carpeta","err");
    out(n);
  },
  tree(){
    const walk=(n,pre)=>{
      const keys=Object.keys(n);
      keys.forEach((k,i)=>{
        const last=i===keys.length-1, dir=typeof n[k]==="object";
        outHTML(pre+(last?"└─ ":"├─ ")+`<span class="${dir?'accent':''}">${k}${dir?'/':''}</span>`);
        if(dir) walk(n[k],pre+(last?"   ":"│  "));
      });
    };
    outHTML("<span class='accent'>~/</span>");
    walk(nodeAt(cwd),"");
  },
  mkdir(args){
    if(!args[0]) return out("uso: mkdir <nombre>","warn");
    const p=nodeAt(cwd); if(args[0] in p) return out("ya existe","err");
    p[args[0]]={};
  },
  touch(args){
    if(!args[0]) return out("uso: touch <nombre>","warn");
    const p=nodeAt(cwd); if(!(args[0] in p)) p[args[0]]="";
  },
  rm(args){
    if(!args[0]) return out("uso: rm <nombre>","warn");
    const p=nodeAt(cwd);
    if(!(args[0] in p)) return out("rm: no existe","err");
    delete p[args[0]];
  },
  calc(args){
    const expr=args.join(" ");
    if(!/^[-0-9.+*/%()\s]+$/.test(expr)) return out("calc: solo numeros y + - * / % ( )","err");
    try{ const r=Function('"use strict";return ('+expr+')')(); out(String(r),"ok"); }
    catch{ out("calc: expresion invalida","err"); }
  },
  banner(){ out(LOGO,"logo"); },
  about(){
    out("NXT27 · Neural eXecution Terminal","accent");
    out("Terminal web con toque visual. Comandos reales, offline.","muted");
    out("Codigo: github.com/s0k1x/Neural-eXecution-Terminal-NXT27","faint");
  },
  neofetch(){
    const ua=navigator.userAgent;
    const os = /Windows/.test(ua)?"Windows": /Android/.test(ua)?"Android":
               /iPhone|iPad|iOS/.test(ua)?"iOS": /Mac/.test(ua)?"macOS":
               /Linux/.test(ua)?"Linux":"Desconocido";
    const br = /Edg/.test(ua)?"Edge": /Chrome/.test(ua)?"Chrome":
               /Firefox/.test(ua)?"Firefox": /Safari/.test(ua)?"Safari":"Navegador";
    const info=[
      [USER+"@"+HOST.toLowerCase(),""],
      ["os",os],["shell","nxt-sh 1.0"],["host",br],
      ["res",`${screen.width}x${screen.height} @${window.devicePixelRatio||1}x`],
      ["cpu",(navigator.hardwareConcurrency||"?")+" hilos"],
      ["mem",(navigator.deviceMemory? navigator.deviceMemory+" GB":"n/d")],
      ["lang",navigator.language||"?"],
      ["uptime",Math.floor((Date.now()-started)/1000)+"s"],
    ];
    const logo=LOGO.split("\n").filter(Boolean);
    const rows=Math.max(logo.length,info.length);
    for(let i=0;i<rows;i++){
      const l=(logo[i]||"").padEnd(46);
      let r="";
      if(info[i]){
        r = info[i][1]==="" ? `<b>${info[i][0]}</b>` : `<span class="accent">${info[i][0]}</span> ${info[i][1]}`;
      }
      outHTML(`<span class="logo">${l.replace(/ /g,"&nbsp;")}</span>${r}`);
    }
  },
  theme(args){
    const t=args[0];
    if(!t||!THEMES[t]){ out("temas: "+Object.keys(THEMES).join(", "),"warn"); return; }
    const [a,b,c]=THEMES[t];
    const r=document.documentElement.style;
    r.setProperty("--accent",a);r.setProperty("--accent-bright",b);r.setProperty("--accent-dim",c);
    out("tema → "+t,"ok");
  },
  history(){ hist.forEach((h,i)=>out("  "+String(i+1).padStart(3)+"  "+h,"muted")); },
  exit(){ term.innerHTML=""; boot(); },
};
const ALIASES={cls:"clear","?":"help",dir:"ls",clr:"clear"};

/* ---------- runner ---------- */
let hist=[], hi=-1;
function run(line){
  const trimmed=line.trim();
  echoCommand(line);
  if(trimmed){
    hist.push(trimmed); hi=hist.length;
    const parts=trimmed.match(/(?:[^\s"]+|"[^"]*")+/g).map(s=>s.replace(/"/g,""));
    let cmd=parts[0].toLowerCase(); const args=parts.slice(1);
    if(ALIASES[cmd]) cmd=ALIASES[cmd];
    if(COMMANDS[cmd]){ try{ COMMANDS[cmd](args); }catch(e){ out("error: "+e.message,"err"); } }
    else out(cmd+": comando no encontrado — escribe 'help'","err");
  }
  renderPrompt(); scroll();
}

/* ---------- autocomplete ---------- */
function complete(){
  const v=input.value, parts=v.split(" ");
  if(parts.length<=1){
    const pool=[...Object.keys(COMMANDS),...Object.keys(ALIASES)];
    const m=pool.filter(c=>c.startsWith(v));
    if(m.length===1) input.value=m[0]+" ";
    else if(m.length>1){ echoCommand(v); out(m.join("  "),"faint"); scroll(); }
  }else{
    const frag=parts[parts.length-1];
    const n=nodeAt(cwd); if(typeof n!=="object") return;
    const m=Object.keys(n).filter(k=>k.startsWith(frag));
    if(m.length===1){ parts[parts.length-1]=m[0]+(typeof n[m[0]]==="object"?"/":""); input.value=parts.join(" "); }
    else if(m.length>1){ echoCommand(v); out(m.join("  "),"faint"); scroll(); }
  }
}

/* ---------- events ---------- */
document.getElementById("inputRow").addEventListener("submit",e=>{
  e.preventDefault(); const v=input.value; input.value=""; run(v);
});
input.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"){ e.preventDefault(); if(hi>0){hi--;input.value=hist[hi]||"";} }
  else if(e.key==="ArrowDown"){ e.preventDefault(); if(hi<hist.length-1){hi++;input.value=hist[hi]||"";} else {hi=hist.length;input.value="";} }
  else if(e.key==="Tab"){ e.preventDefault(); complete(); }
  else if(e.key==="l"&&e.ctrlKey){ e.preventDefault(); COMMANDS.clear(); }
  else if(e.key==="c"&&e.ctrlKey){ echoCommand(input.value+"^C"); input.value=""; renderPrompt(); scroll(); }
});
// keep focus; tap anywhere focuses input (mobile keyboard)
term.addEventListener("click",()=>{ if(!getSelection().toString()) input.focus(); });
document.getElementById("app").addEventListener("click",e=>{
  if(e.target.closest(".bar")) return;
  if(!getSelection().toString()) input.focus();
});

/* ---------- clock ---------- */
setInterval(()=>{ clkEl.textContent=new Date().toTimeString().slice(0,8); },1000);

/* ---------- boot ---------- */
function boot(){
  out(LOGO,"logo");
  out("");
  outHTML(`<span class="accent">Neural eXecution Terminal</span> <span class="faint">v1.0</span>`);
  out("Terminal web — comandos reales, sin conexion.","muted");
  outHTML(`Escribe <b>help</b> para empezar · prueba <b>neofetch</b>, <b>calc 7*6</b>, <b>theme cyan</b>`,"muted");
  out("");
  renderPrompt(); scroll();
}
boot();
input.focus();
</script>
</body>
</html>
